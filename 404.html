<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Eagle Bank</title>
    <script>
      // Redirect SPA routes to index.html, preserving the path as a query param.
      // pathSegmentsToKeep=1 for project pages (github.com/user/repo).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/' +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
